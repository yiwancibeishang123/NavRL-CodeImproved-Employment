defaults:
  - _self_
  - drone
  - lag_ppo
  - sim

headless: True
device: "cuda:0"
seed: 0

max_frame_num: 12e8
eval_interval: 1000
save_interval: 1000

evaluation:
  eval_only: false
  checkpoint_path:
